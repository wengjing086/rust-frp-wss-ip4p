<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img">
<title>bindPort 同端口两级嗅探</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="800" height="390" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="20" y="27" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#1f2328">bindPort 同端口两级嗅探</text>
<text x="780" y="27" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="400" fill="#57606a">为什么 wss 能省掉 nginx</text>
<path d="M20 39 L780 39" stroke="#d8dee4" stroke-width="1" fill="none"/>
<rect x="16" y="50" width="370" height="260" rx="12" fill="#eef5fc" stroke="#c9dcf0" stroke-width="1.2"/>
<rect x="402" y="50" width="382" height="260" rx="12" fill="#e8f5f0" stroke="#b8ddd0" stroke-width="1.2"/>
<text x="30" y="72" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#185FA5">第 1 级 · TCP 明文层</text>
<text x="416" y="72" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#0F6E56">第 2 级 · TLS 解密后（本项目新增）</text>
<rect x="30" y="84" width="342" height="40" rx="9" fill="#ffffff" stroke="#185FA5" stroke-width="1.1"/>
<text x="201.0" y="108.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="500" fill="#1f2328">新连接到达 bindPort 7000</text>
<rect x="30" y="138" width="342" height="44" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="1"/>
<circle cx="48" cy="160" r="11" fill="#185FA5"/>
<text x="48" y="164" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#ffffff">1</text>
<text x="198" y="157" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1f2328">带 Upgrade: websocket</text>
<text x="198" y="173" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#57606a">→ 明文 WebSocket 升级（路径不限）</text>
<rect x="30" y="190" width="342" height="44" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="1"/>
<circle cx="48" cy="212" r="11" fill="#185FA5"/>
<text x="48" y="216" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#ffffff">2</text>
<text x="198" y="209" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1f2328">普通 HTTP 请求</text>
<text x="198" y="225" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#57606a">→ 回最小 HTTP 200（CDN 健康检查）</text>
<rect x="30" y="242" width="342" height="44" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="1"/>
<circle cx="48" cy="264" r="11" fill="#185FA5"/>
<text x="48" y="268" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#ffffff">3</text>
<text x="198" y="261" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1f2328">其它字节</text>
<text x="198" y="277" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#57606a">→ 保留字节，进入 TLS 分支</text>
<rect x="416" y="84" width="354" height="40" rx="9" fill="#ffffff" stroke="#0F6E56" stroke-width="1.1"/>
<text x="593.0" y="108.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#1f2328">0x16 标准 TLS / 0x17 frp 自定义首字节</text>
<rect x="416" y="138" width="354" height="44" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="1"/>
<circle cx="434" cy="160" r="11" fill="#0F6E56"/>
<text x="434" y="164" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#ffffff">1</text>
<text x="596" y="157" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1f2328">仍是 WS 升级请求</text>
<text x="596" y="173" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#57606a">→ WSS 直连（官方 frps 不支持）</text>
<rect x="416" y="190" width="354" height="44" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="1"/>
<circle cx="434" cy="212" r="11" fill="#0F6E56"/>
<text x="434" y="216" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#ffffff">2</text>
<text x="596" y="209" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1f2328">不是 WS 升级请求</text>
<text x="596" y="225" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#57606a">→ 字节无损回放，frp over TLS / TCP</text>
<rect x="416" y="242" width="354" height="44" rx="8" fill="#ffffff" stroke="#BA7517" stroke-width="1"/>
<circle cx="434" cy="264" r="11" fill="#BA7517"/>
<text x="434" y="268" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#ffffff">3</text>
<text x="596" y="261" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1f2328">官方 frps 只做第 1 级</text>
<text x="596" y="277" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#57606a">→ wss 必须前置 nginx 终结 TLS</text>
<path d="M386 180 L400 180" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="393" y="170" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10" font-weight="400" fill="#57606a">否</text>
<rect x="16" y="322" width="768" height="46" rx="9" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.1"/>
<text x="400.0" y="349.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#1f2328">四条路径最终汇入同一套 yamux + frp 控制流程；判据是「合法 WS 升级请求」，安全由 token 把守，不靠路径保密</text>
</svg>