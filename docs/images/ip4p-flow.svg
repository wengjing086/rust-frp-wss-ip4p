<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img">
<title>IP4P 解析顺序</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="800" height="270" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="20" y="27" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#1f2328">IP4P 解析顺序</text>
<text x="780" y="27" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="400" fill="#57606a">无需任何新增配置键</text>
<path d="M20 39 L780 39" stroke="#d8dee4" stroke-width="1" fill="none"/>
<rect x="16" y="54" width="180" height="118" rx="10" fill="#f6f8fa" stroke="#185FA5" stroke-width="1.3"/>
<rect x="16" y="54" width="4" height="118" rx="2" fill="#185FA5"/>
<circle cx="40" cy="76" r="11" fill="#185FA5"/>
<text x="40" y="80" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#ffffff">1</text>
<text x="106" y="81" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">IP 字面量?</text>
<text x="106" y="108" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="400" fill="#57606a">是 → 直接拨号</text>
<text x="106" y="128" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="500" fill="#185FA5">零 DNS 开销</text>
<path d="M197 113 L211 113" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="213" y="54" width="180" height="118" rx="10" fill="#f6f8fa" stroke="#185FA5" stroke-width="1.3"/>
<rect x="213" y="54" width="4" height="118" rx="2" fill="#185FA5"/>
<circle cx="237" cy="76" r="11" fill="#185FA5"/>
<text x="237" y="80" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#ffffff">2</text>
<text x="303" y="81" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">查 TXT</text>
<text x="303" y="108" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="400" fill="#57606a">base64 或明文</text>
<text x="303" y="128" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="500" fill="#185FA5">IP:端口</text>
<text x="303" y="152" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="400" fill="#57606a">203.0.113.7:18246</text>
<path d="M394 113 L408 113" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="410" y="54" width="180" height="118" rx="10" fill="#f6f8fa" stroke="#0F6E56" stroke-width="1.3"/>
<rect x="410" y="54" width="4" height="118" rx="2" fill="#0F6E56"/>
<circle cx="434" cy="76" r="11" fill="#0F6E56"/>
<text x="434" y="80" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#ffffff">3</text>
<text x="500" y="81" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">查 AAAA</text>
<text x="500" y="108" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="400" fill="#57606a">IP4P 编码 IPv6</text>
<text x="500" y="128" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="500" fill="#0F6E56">2001:0000::/16</text>
<path d="M591 113 L605 113" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="607" y="54" width="180" height="118" rx="10" fill="#f6f8fa" stroke="#0F6E56" stroke-width="1.3"/>
<rect x="607" y="54" width="4" height="118" rx="2" fill="#0F6E56"/>
<circle cx="631" cy="76" r="11" fill="#0F6E56"/>
<text x="631" y="80" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#ffffff">4</text>
<text x="697" y="81" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">都未命中</text>
<text x="697" y="108" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="400" fill="#57606a">回退原地址</text>
<text x="697" y="128" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="500" fill="#0F6E56">与官方行为一致</text>
<rect x="16" y="190" width="768" height="42" rx="9" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.1"/>
<text x="400.0" y="215.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="500" fill="#1f2328">命中即覆盖 serverPort；dnsServer 可指定查询服务器；命中缓存 10 秒、未命中 60 秒</text>
<text x="400" y="252" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#57606a">serverAddr 为 IP 字面量时完全跳过 DNS 探测，零额外开销</text>
</svg>