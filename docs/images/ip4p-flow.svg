<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210" role="img">
<title>IP4P 解析顺序</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="800" height="210" rx="12" fill="#ffffff"/>
<rect x="15" y="40" width="175" height="80" rx="10" fill="#f6f8fa" stroke="#185FA5" stroke-width="1.5"/>
<rect x="15" y="40" width="5" height="80" rx="2" fill="#185FA5"/>
<text x="102" y="71.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1f2328">1. IP 字面量</text>
<text x="102" y="94.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#57606a">直接拨号，零 DNS</text>
<path d="M193 80 L209 80" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="212" y="40" width="175" height="80" rx="10" fill="#f6f8fa" stroke="#185FA5" stroke-width="1.5"/>
<rect x="212" y="40" width="5" height="80" rx="2" fill="#185FA5"/>
<text x="300" y="71.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1f2328">2. 查 TXT</text>
<text x="300" y="94.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#57606a">命中 IPv4:端口</text>
<path d="M390 80 L406 80" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="409" y="40" width="175" height="80" rx="10" fill="#f6f8fa" stroke="#0F6E56" stroke-width="1.5"/>
<rect x="409" y="40" width="5" height="80" rx="2" fill="#0F6E56"/>
<text x="496" y="71.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1f2328">3. 查 AAAA</text>
<text x="496" y="94.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#57606a">解出 IP4P 地址</text>
<path d="M587 80 L603 80" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="606" y="40" width="175" height="80" rx="10" fill="#f6f8fa" stroke="#0F6E56" stroke-width="1.5"/>
<rect x="606" y="40" width="5" height="80" rx="2" fill="#0F6E56"/>
<text x="694" y="71.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1f2328">4. 都未命中</text>
<text x="694" y="94.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#57606a">回退原地址</text>
<text x="400" y="165" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#57606a">命中即覆盖拨号目标；详细记录格式见下表</text>
</svg>